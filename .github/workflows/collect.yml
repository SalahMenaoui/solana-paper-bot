name: collect

on:
  schedule:
    # Toutes les 30 min, à :07 et :37 : GitHub retarde ou saute souvent les runs planifiés
    # à l'heure pile et à la demie (créneaux surchargés).
    - cron: "7,37 * * * *"
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write             # nécessaire pour pousser la branche data

# Jamais deux runs en même temps (sinon conflit sur la base).
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BOT_DATA_DIR: datastore   # la branche data est extraite dans ce dossier
    steps:
      - uses: actions/checkout@v5          # le code (branche main)

      - uses: actions/checkout@v5          # les données (branche data, fichiers .gz)
        with:
          ref: data
          path: datastore

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run collector
        run: python collect.py   # décompresse bot.db.gz, et les archives seulement si besoin

      - name: Save data
        if: success() || failure()   # on sauvegarde même si le script a planté en cours de route
        working-directory: datastore
        run: |
          python -m bot.storage pack
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Un seul commit sur la branche data, réécrit à chaque run : l'historique ne grossit pas.
          git checkout --quiet --orphan snapshot
          git add -A
          git commit --quiet -m "data: run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push --force origin snapshot:data
        env:
          BOT_DATA_DIR: .
          PYTHONPATH: ${{ github.workspace }}
