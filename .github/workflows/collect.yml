name: collect

on:
  schedule:
    - cron: "*/30 * * * *"   # toutes les 30 min (GitHub peut avoir du retard)
  workflow_dispatch:          # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write             # nécessaire pour committer data/bot.db

# Jamais deux runs en même temps (sinon conflit sur la base).
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run collector
        run: python collect.py

      - name: Commit database
        if: success() || failure()   # on sauvegarde même si le script a planté en cours de route
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/bot.db
          if git diff --cached --quiet; then
            echo "Rien à committer"
            exit 0
          fi
          git commit -m "data: run $(date -u +%Y-%m-%dT%H:%MZ)"
          git push || (git pull --rebase && git push)
